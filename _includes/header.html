<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="prompt">~$</span> {{ site.author.name }}</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>home</a>
      <a href="{{ '/writeups/' | relative_url }}"{% if page.url contains '/writeups/' %} class="active"{% endif %}>writeups</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>about</a>
      <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">github</a>
    </nav>
  </div>
</header>
