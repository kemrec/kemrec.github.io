title: Kaya Emre Arıkan
tagline: Security Research & Responsible Disclosure
description: >-
  Writeups on vulnerabilities I've found and responsibly disclosed —
  published only after the vendor advisory or CVE is public.
url: "https://kearikan.com"
baseurl: ""

author:
  name: Kaya Emre Arıkan
  github: kemrec

collections:
  writeups:
    output: true
    permalink: /writeups/:path/
  research:
    output: true
    permalink: /research/:path/

defaults:
  - scope:
      path: ""
      type: writeups
    values:
      layout: writeup
  - scope:
      path: ""
      type: research
    values:
      layout: research
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-feed
  - jekyll-sitemap

# This site publishes into the `writeups` and `research` collections, not
# `posts`. jekyll-feed's default feed only covers `posts` (empty here), so feed
# it the collections — this generates populated Atom feeds at /feed/writeups.xml
# and /feed/research.xml (the <head> links point there). A same-path override to
# /feed.xml collides with the empty posts feed on the GitHub Pages (legacy)
# build, so the collection default paths are used.
feed:
  posts_limit: 50   # default is 10; keep the whole writeups history in the feed
  collections:
    writeups:
      path: "/feed/writeups.xml"
    research:
      path: "/feed/research.xml"

markdown: kramdown
highlighter: rouge

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - drafts
  - vendor
  - .bundle
